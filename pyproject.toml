[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tutor-contrib-restrictedsignup"
version = "1.6.0"
description = "Disable public registration and enable instructor-driven CSV account creation for Open edX via Tutor"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "AGPL-3.0"}
authors = [
    {name = "Sysnapps", email = "contact@sysnapps.com"}
]
dependencies = [
    "tutor>=17.0.0",
]

[project.urls]
Homepage = "https://github.com/sysnapps-com/oedx-restricted-signups"
Repository = "https://github.com/sysnapps-com/oedx-restricted-signups"

[project.entry-points."tutor.plugin.v1"]
restrictedsignup = "tutor_restrictedsignup.plugin"

[tool.setuptools]
packages = ["tutor_restrictedsignup"]